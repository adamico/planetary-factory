modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
The Planetary Factory modpack's first-party mod. It owns the mechanisms no scripting
API in the pack exposes -- currently the saplings of Sapros's two trees and their
TreeGrower -- and no tunable content whatsoever. See ADR-0014 and ADR-0015.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

# GTCEu never asks the vanilla RecipeManager, so Researchd's own lock cannot see a GT
# machine. `RecipeLogicMixin` is that hook; both mods are hard requirements for it.
[[dependencies.${mod_id}]]
modId = "gtceu"
type = "required"
versionRange = "[7.0.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "researchd"
type = "required"
versionRange = "[1.2.5,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "planetaryfactory_core.mixins.json"

# Separate, and not required, because it targets EMI -- an optional client-side dependency. A
# missing target class in the main config would be fatal; here it is skipped.
[[mixins]]
config = "planetaryfactory_core.emi.mixins.json"

# Both recipe viewers ship with the pack and both were listing a research-locked recipe exactly
# like an unlocked one (issue #75). Neither is required for the mod to load. JEI is driven by a
# plugin its own annotation scan discovers; EMI needs a mixin, because the equivalent EMI seam is
# gated behind a developer-facing config flag that is off for players -- see RecipeDisplayMixin.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
ordering = "AFTER"
side = "CLIENT"
