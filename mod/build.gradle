plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = maven_group
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

// The mixin in `mixin/gtceu` compiles against GTCEu and Researchd. Both are pack mods, so their
// jars are already in `mods/` -- taken from there rather than from a maven so the build stays
// offline and always compiles against exactly the jars the pack ships.
//
// GTCEu ships LDLib as a jar-in-jar rather than depending on the pack's `ldlib2-*.jar`, which is a
// different mod under a different package. Nothing here uses LDLib, but GTCEu's `MetaMachine`
// implements one of its interfaces and javac loads a class's whole supertype hierarchy before it
// will resolve any call on it -- so reading a machine's position needs the nested jar unpacked.
def gtceuJars = rootProject.fileTree('mods').matching { include 'gtceu-*.jar' }.files
if (gtceuJars.size() != 1) {
    throw new GradleException(
            "Expected exactly one gtceu-*.jar in mods/ to unpack LDLib from, found ${gtceuJars.size()}: " +
            "${gtceuJars*.name}. The jar set is a packwiz manifest (ADR-0024) -- reconcile mods/ with it.")
}

def extractLdLib = tasks.register('extractLdLib', Copy) {
    from(zipTree(gtceuJars.first())) {
        include 'META-INF/jarjar/ldlib-*.jar'
    }
    into layout.buildDirectory.dir('ldlib')
    eachFile { it.path = it.name }
    includeEmptyDirs = false
}

dependencies {
    // EMI and JEI are here for the recipe-viewer lock annotation (issue #75), and Jade for the
    // pole's live HUD line (#147). All three plugin classes are found by their own host's
    // annotation scan and referenced from nowhere else in the mod, so none of the jars is needed
    // at runtime for the rest of it to load.
    //
    // Jade's jar ships with a capital J, so the pattern carries both spellings rather than relying
    // on a case-insensitive filesystem to paper over it.
    compileOnly fileTree(
            dir: rootProject.file('mods'),
            include: ['gtceu-*.jar', 'researchd-*.jar', 'emi-*.jar', 'jei-*.jar',
                      'Jade-*.jar', 'jade-*.jar'])
    compileOnly fileTree(dir: layout.buildDirectory.dir('ldlib'), include: ['*.jar'])
            .builtBy(extractLdLib)

    // DataFixerUpper, and only DataFixerUpper. `Codec` is Mojang's serialisation library rather
    // than a Minecraft type, so the Assembler's attachment codec can be round-tripped on a plain
    // JVM -- which is what ADR-0038's "round-trip the data attachment" asks for. Minecraft itself
    // stays off this classpath; the version is the one Minecraft 1.21.1 ships.
    testImplementation 'com.mojang:datafixerupper:8.0.16'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

repositories {
    mavenCentral()
}

// The test source set is deliberately absent from `neoForge.mods` above, so Minecraft is not on its
// classpath. That is the pack's testing policy, not an oversight: the row for "this pack logic
// computes something" asks for an ordinary unit test run without Minecraft, and a classpath that
// cannot see a `ResourceLocation` is what keeps the logic honest about staying testable.
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging { events 'failed' }
}

// `neoforge.mods.toml` is the one place a version string has to be interpolated;
// everything else the mod knows lives in the pack's data, not in the jar.
def modMetadata = [
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_version         : mod_version,
        minecraft_version   : minecraft_version,
        loader_version_range: loader_version_range,
        // The pack ships one NeoForge build; the mod refuses to load on an older one.
        neoforge_version_range: "[${neoforge_version},)",
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties modMetadata
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand modMetadata
    }
}

// The pack loads jars from `mods/`, which is gitignored. Build straight into it so
// `./gradlew build` is the whole install step.
tasks.register('installToPack', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into rootProject.file('mods')
}
